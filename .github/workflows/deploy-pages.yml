name: Deploy ECHO web widget

on:
  push:
    branches: [main]
    paths:
      - "echo-desktop-widget/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare widget site
        env:
          ECHO_API_URL: ${{ vars.ECHO_API_URL }}
        run: |
          mkdir -p _site
          cp -R echo-desktop-widget/. _site/
          python3 -c 'import json, os; print("window.ECHO_API_BASE = " + json.dumps(os.environ.get("ECHO_API_URL", "").rstrip("/")) + ";")' > _site/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
